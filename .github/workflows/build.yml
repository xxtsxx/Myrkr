# Myrkr CI - full static analysis, self-test, security/redteam/crypto/archive
# gates, reproducible release build proof, and MSI structural + costed-session
# verification on every push, PR, and nightly schedule.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Strict debug build + 8 static checkers + KAT selftest
        shell: cmd
        run: |
          call build.cmd dbg strict
          if errorlevel 1 exit /b 1
          bin\myrkr.exe selftest
          if errorlevel 1 exit /b 1

      - name: Active-defence redteam, segmented nonce, independent GCM & crash gates
        shell: cmd
        run: |
          python tests\redteam.py
          if errorlevel 1 exit /b 1
          python tests\nonceforktest.py --segments
          if errorlevel 1 exit /b 1
          python tests\indepdecrypttest.py
          if errorlevel 1 exit /b 1
          python tests\crashtest.py
          if errorlevel 1 exit /b 1

      - name: Strict testio build + container, ZIP bounds/claims, long-name & hazard gates
        shell: cmd
        run: |
          call build.cmd testio strict
          if errorlevel 1 exit /b 1
          python tests\secsuite.py
          if errorlevel 1 exit /b 1
          python tests\zipboundstest.py
          if errorlevel 1 exit /b 1
          python tests\zipclaimtest.py
          if errorlevel 1 exit /b 1
          python tests\longnametest.py
          if errorlevel 1 exit /b 1
          python tests\extracthazardtest.py
          if errorlevel 1 exit /b 1
          python tests\nonceforktest.py
          if errorlevel 1 exit /b 1

      - name: Reproducible release build proof + release selftest
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\verify_repro.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\bin\myrkr.exe selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify per-machine MSI package
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\make_msi.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\verify_msi.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release binaries and verified MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: myrkr-release
          path: |
            bin/myrkr.exe
            bin/myrkrshell.dll
            bin/SHA256SUMS.txt
            bin/myrkr-*.msi
